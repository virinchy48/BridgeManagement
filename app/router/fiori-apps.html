<!doctype html>
<html>

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge Management System (BMS)</title>

  <script>
    window['sap-ushell-config'] = {
      defaultRenderer: 'fiori2',
      renderers: {
        fiori2: {
          componentData: {
            config: {
              enableSearch: false,
              enablePersonalization: false,
              enableAppFinder: false,
              enableSetTheme: false,
              preloadLibrariesForRootIntent: false
            }
          }
        }
      }
    }
  </script>

  <script
    id="sap-ushell-bootstrap"
    src="https://sapui5.hana.ondemand.com/1.145.0/test-resources/sap/ushell/bootstrap/sandbox.js">
  </script>

  <script
    id="sap-ui-bootstrap"
    src="https://sapui5.hana.ondemand.com/1.145.0/resources/sap-ui-core.js"
    data-sap-ui-libs="sap.ui.core,sap.m,sap.ushell,sap.ui.layout,sap.fe.templates"
    data-sap-ui-flexibilityServices='[{"connector": "LocalStorageConnector"}]'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="allow"
    data-sap-ui-preload="async">
  </script>

  <script>
    sap.ui.getCore().attachInit(() => {
      sap.ushell.Container
        .createRenderer('fiori2', true)
        .then(renderer => renderer.placeAt('content'))
    })
  </script>
</head>

<body class="sapUiBody" id="content"></body>

</html>
